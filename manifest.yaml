manifestVersion: 1
name: "@retr0h/golang-starter"
version: "2026.09.03.3"
description: "Scaffold a Go project — module, justfile, CI workflows, linters and release config in one workflow. Library and CLI variants."
repository: https://github.com/retr0h/swamp-golang-starter
labels:
  - golang
  - go
  - scaffold
  - starter
  - project-setup
models:
  - go_project.ts
workflows:
  - create-go-lib.yaml
  - create-go-cli.yaml
  - retemplate-go.yaml
skills:
  - golang-starter
additionalFiles:
