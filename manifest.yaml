  - templates/.github/workflows/release.yml
  - templates/.github/workflows/report-card.yml
  - templates/.github/workflows/stale.yml
  - templates/AGENTS.md
  - templates/AI_POLICY.md
  - templates/CLAUDE.md
  - templates/CODE_OF_CONDUCT.md
  - templates/CONTRIBUTING.md
