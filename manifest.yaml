  - templates/.github/workflows/commit-lint.yml
  - templates/.github/workflows/dep-review.yml
  - templates/.github/workflows/go.yml
  - templates/.github/workflows/greetings.yml
  - templates/.github/workflows/just-lint.yml
  - templates/.github/workflows/labeler.yml
