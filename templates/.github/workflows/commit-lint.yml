name: Commit Lint
on:
  pull_request:
    branches: [ "@@defaultBranch@@" ]
jobs:
  build:
    name: Conventional Commits
    runs-on: @@runsOn@@
    steps:
      - uses: actions/checkout@v7
      - uses: webiny/action-conventional-commits@v1.4.2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
