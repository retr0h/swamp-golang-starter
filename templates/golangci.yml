# golangci-lint v2 configuration.
# https://golangci-lint.run/docs/configuration/file/

version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - errname
    - govet
    - prealloc
    - predeclared
    - revive
    - staticcheck
    - unused
  settings:
    revive:
      enable-all-rules: true
  exclusions:
    presets:
      - comments
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
