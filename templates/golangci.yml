# golangci-lint v2 configuration.
# https://golangci-lint.run/docs/configuration/file/
#
# One config, byte for byte identical in every Go repository in osapi-io and in
# @retr0h/golang-starter, which new projects are generated from. A repository
# that needs a change to it changes it in the template too, and the change goes
# back out to the others in the same pass — a rule that fires in six places and
# is tuned in one is not the same rule any more. `md5 .golangci.yml` in each
# repository is how you check.
#
# `version` is the string "2" and settings nest under `linters`. Written the v1
# way — a numeric version, a top-level `linters-settings`, an
# `issues.exclude-use-default` — `run` drops the keys without complaint and
# nothing takes effect. `golangci-lint config verify` is the check.

version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - errname
    - govet
    - prealloc
    - predeclared
    - revive
    - staticcheck
    - unused
  settings:
    revive:
      enable-all-rules: true
      rules:
        # golines --max-len=80 in `just go-fmt` wraps code at 80. It cannot
        # wrap a doc comment or a log string, which is all this rule ever
        # fires on. Measured on nats-client: 163 findings, none of them code.
        - name: line-length-limit
          disabled: true
        # 0, 1 and 2 are not magic. `i+1`, `parts[0]` and `Times(1)` hide
        # nothing, and naming them makes the code worse. Left at its defaults
        # this rule reported 225 findings on nats-client, 116 of them the
        # literal 1.
        - name: add-constant
          arguments:
            - allowInts: "0,1,2"
              allowStrs: '""'
              maxLitCount: "3"
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      # These three rules ask whether a function does too much. A table-driven
      # test does not: it holds a list of cases and one small loop. revive
      # counts the whole literal, closures included, so a ten-case table reads
      # as complexity twenty while the loop body under it branches twice.
      #
      # They stay on for production, where they found four functions on
      # nats-client genuinely worth splitting — ConsumeMessages at 23, WatchKV
      # at 20, Connect at 14.
      - path: _test\.go$
        text: "function-length|cognitive-complexity|cyclomatic"

formatters:
  enable:
    - gofmt
    - goimports

issues:
  # Without these every run stops at 50 findings per linter and the repository
  # looks like it has exactly 50 problems, forever.
  max-issues-per-linter: 0
  max-same-issues: 0
