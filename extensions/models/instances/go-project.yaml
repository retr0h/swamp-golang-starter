type: '@retr0h/go-project'
typeVersion: 2026.09.03.1
name: go-project
version: 1
tags:
  project: golang
inputs:
  properties:
    project_name:
      type: string
      description: Project name (lowercase, alphanumeric, hyphens only)
    kind:
      type: string
      default: "lib"
      description: "Project shape: lib or cli"
    owner:
      type: string
      default: "retr0h"
      description: GitHub owner; the module path is built from it
    description:
      type: string
      default: ""
      description: One-line repository description
    parent_dir:
      type: string
      default: "~/git"
      description: Parent directory the project folder is created in
    go_version:
      type: string
      default: "1.25"
      description: Go version written to go.mod
    justfiles_repo:
      type: string
      default: "https://raw.githubusercontent.com/osapi-io/osapi-justfiles/refs/heads/main"
      description: Base URL the justfile fetches shared recipes from
  required:
    - project_name
globalArguments:
  projectName: ${{ inputs.project_name }}
  kind: ${{ inputs.kind }}
  owner: ${{ inputs.owner }}
  description: ${{ inputs.description }}
  parentDir: ${{ inputs.parent_dir }}
  goVersion: ${{ inputs.go_version }}
  justfilesRepo: ${{ inputs.justfiles_repo }}
methods: {}
