type: '@retr0h/go-project'
typeVersion: 2026.09.03.5
id: f62e2bab-8202-49e9-89ee-489d97ad55b8
name: go-project
version: 1
tags:
  project: golang
inputs:
  properties:
    project_name:
      type: string
      description: Project name (lowercase, alphanumeric, hyphens only)
    kind:
      type: string
      default: "lib"
      description: "Project shape: lib or cli"
    owner:
      type: string
      default: "retr0h"
    module_host:
      type: string
      default: "github.com"
    description:
      type: string
      default: ""
    author:
      type: string
      default: ""
    license:
      type: string
      default: "MIT"
    email:
      type: string
      default: ""
    pkg_path:
      type: string
      default: ""
    with_badges:
      type: boolean
      default: true
    with_code_of_conduct:
      type: boolean
      default: true
    parent_dir:
      type: string
      default: "~/git"
    go_version:
      type: string
      default: "1.26"
    coverage_target:
      type: string
      default: "100%"
    default_branch:
      type: string
      default: "main"
    runs_on:
      type: string
      default: "ubuntu-latest"
    go_version_mise:
      type: string
      default: "latest"
      description: Go version mise provisions
    go_version_ci:
      type: string
      default: "stable"
    overwrite:
      type: boolean
      default: false
    shared_justfiles:
      type: boolean
      default: false
    justfiles_repo:
      type: string
      default: "https://raw.githubusercontent.com/osapi-io/osapi-justfiles/refs/heads/main"
    with_ci:
      type: boolean
      default: true
    with_releaser:
      type: boolean
      default: true
    with_codecov:
      type: boolean
      default: true
    with_dependabot:
      type: boolean
      default: true
    with_labeler:
      type: boolean
      default: true
    with_agent_docs:
      type: boolean
      default: true
    with_repos_json:
      type: boolean
      default: false
  required:
    - project_name
globalArguments:
  projectName: ${{ inputs.project_name }}
  kind: ${{ inputs.kind }}
  owner: ${{ inputs.owner }}
  moduleHost: ${{ inputs.module_host }}
  description: ${{ inputs.description }}
  author: ${{ inputs.author }}
  license: ${{ inputs.license }}
  email: ${{ inputs.email }}
  pkgPath: ${{ inputs.pkg_path }}
  withBadges: ${{ inputs.with_badges }}
  withCodeOfConduct: ${{ inputs.with_code_of_conduct }}
  parentDir: ${{ inputs.parent_dir }}
  goVersion: ${{ inputs.go_version }}
  coverageTarget: ${{ inputs.coverage_target }}
  defaultBranch: ${{ inputs.default_branch }}
  runsOn: ${{ inputs.runs_on }}
  goVersionMise: ${{ inputs.go_version_mise }}
  goVersionCI: ${{ inputs.go_version_ci }}
  overwrite: ${{ inputs.overwrite }}
  sharedJustfiles: ${{ inputs.shared_justfiles }}
  justfilesRepo: ${{ inputs.justfiles_repo }}
  withCI: ${{ inputs.with_ci }}
  withReleaser: ${{ inputs.with_releaser }}
  withCodecov: ${{ inputs.with_codecov }}
  withDependabot: ${{ inputs.with_dependabot }}
  withLabeler: ${{ inputs.with_labeler }}
  withAgentDocs: ${{ inputs.with_agent_docs }}
  withReposJson: ${{ inputs.with_repos_json }}
methods: {}
